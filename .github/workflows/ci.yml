name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um PR com push novo cancela a execução anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      # Placeholders: config.py exige essas variáveis no import. Os testes não
      # conectam no banco nem na Supabase.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Poetry
        run: pipx install poetry==2.5.1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: poetry
          cache-dependency-path: api/poetry.lock

      - name: Instalar dependências
        run: poetry install --no-interaction --no-root

      - name: Testes
        run: poetry run pytest -q

      - name: App importa sem erro
        run: poetry run python -c "import main"

  frontend:
    name: Frontend (tipos, formatação, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      # Valores públicos fictícios só para o build ($env/static/public)
      PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Tipos (svelte-check)
        run: pnpm check

      - name: Testes (node --test)
        run: pnpm test

      - name: Formatação (Prettier em src/)
        run: pnpm exec prettier --check src

      - name: Build
        run: pnpm build
